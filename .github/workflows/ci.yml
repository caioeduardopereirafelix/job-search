name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobmatch
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d jobmatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/jobmatch
      DB_USER: ci
      DB_PASSWORD: ci
      # Nao usadas em nenhuma chamada de rede durante o build/testes (o scheduler
      # fica desligado via scheduler.enabled=false no ApplicationTests) - so
      # precisam existir para a aplicacao subir, ja que sao ${VAR} obrigatorias
      # no application.yaml.
      ADZUNA_APP_ID: ci-placeholder
      ADZUNA_APP_KEY: ci-placeholder
      JWT_SECRET: ci-placeholder-secret-key-at-least-32-bytes-long

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes (mvnw test)
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (compilacao TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar TypeScript
        run: npm run build

      - name: Falhar se o build gerou diferencas nao commitadas nos .js
        run: git diff --exit-code -- src/main/resources/static/js

  deploy:
    name: Deploy na VPS (Oracle Cloud)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # So depois que os dois jobs acima passarem, e so em push direto na main
    # (nunca em pull_request - PR de fora nao pode disparar deploy).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Atualizar e reiniciar a aplicacao na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/job-search
            docker compose -f docker-compose.prod.yaml down
            git pull
            docker compose -f docker-compose.prod.yaml up -d --build
            docker image prune -f
