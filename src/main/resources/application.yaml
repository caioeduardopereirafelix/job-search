spring:
  application:
    name: job-search

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

adzuna:
  app-id: ${ADZUNA_APP_ID}
  app-key: ${ADZUNA_APP_KEY}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

resume:
  storage-path: ${RESUME_STORAGE_PATH:./uploads/resumes}